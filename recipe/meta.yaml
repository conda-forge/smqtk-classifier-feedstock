{% set name = "smqtk-classifier" %}
{% set version = "0.21.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/smqtk_classifier-{{ version }}.tar.gz
  sha256: e9e1141f6f46dcf15dcf4d07f07d466c639faecb24c2ccdbbcfb445b993e7bd4

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python
    - pip
    - poetry-core
  run:
    - python
    - numpy >=1.23.5  # [py<313]
    - numpy >=2.1  # [py>=313]
    - smqtk-core >=0.22.0
    - smqtk-dataprovider >=0.20.0
    - smqtk-descriptors >=0.21.0
  run_constrained:
    - scikit-learn >=1.6
    - scipy >=1.8

test:
  imports:
    - smqtk_classifier
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Kitware/SMQTK-Classifier
  summary: Algorithms, data structures and utilities around performing classification of inputs.
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Purg
    - barry-ravichandran
